services:
  postgres:
    image: postgres:16-alpine
    container_name: esportsamaze_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: esportsamaze
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d esportsamaze"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
