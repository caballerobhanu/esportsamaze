# ==============================================================================
# EsportsAmaze — High-Performance Production Nginx Configuration
# Target: /etc/nginx/sites-available/esportsamaze.com
# Tuned for: Cloudflare Free Tier Edge CDN, NVMe SSD Micro-Caching, and Next.js 16
#
# esportsamaze.in is NOT served here. It redirects to this domain with a
# .htaccess in its own document root on the old hosting — see
# deploy/redirects/.htaccess and scripts/build-legacy-redirects.ts.
#
# The foreign hostname kraftonindiaesports.io (a leftover from the template this
# file was adapted from — see AGENTS.md) was removed from server_name on
# 2026-09-20 so this vhost can never serve the site on a hostname we do not own.
# The HSTS header below is includeSubDomains; preload, so serving that hostname
# would pin HSTS to a domain we control nothing in. esportsamaze.com and www stay
# matched. Always `nginx -t` before reloading. The cert paths further down are
# correct for the live server.
# ==============================================================================

# 1. Rate Limiting Zones (Real visitor IPs resolved via Cloudflare Real-IP module)
limit_req_zone $binary_remote_addr zone=esports_req:20m rate=150r/s;
limit_req_zone $binary_remote_addr zone=esports_auth:10m rate=10r/m;
limit_req_status 429;

# 2. Fast NVMe Micro-Cache Zone (RAM/SSD cached responses for public read spikes)
# Inactive entries purged after 60 mins; max size 2GB
proxy_cache_path /var/cache/nginx/esportsamaze levels=1:2 keys_zone=ESPORTS_CACHE:20m max_size=2g inactive=60m use_temp_path=off;

# 3. HTTP Server (Port 80) — Let's Encrypt ACME & Permanent HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name esportsamaze.com www.esportsamaze.com;

    # Let's Encrypt validation root
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 4. HTTPS Server (Port 443) — Production Application Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name esportsamaze.com www.esportsamaze.com;

    # SSL Certificates (Cloudflare Origin CA / VPS Origin SSL).
    # Aligned to the live VPS on 2026-09-18: esportsamaze.crt / esportsamaze.key are
    # what exist in /etc/ssl/cloudflare/ and what the running config references. The
    # previous krafton.crt / krafton.key values were stale template names and would
    # have failed `nginx -t` on a fresh setup.
    ssl_certificate /etc/ssl/cloudflare/esportsamaze.crt;
    ssl_certificate_key /etc/ssl/cloudflare/esportsamaze.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:20m;
    ssl_session_tickets off;

    # Max upload size (Tournament rosters, banners, screenshots up to 25MB)
    client_max_body_size 25M;

    # High-concurrency buffer and timeout tuning
    proxy_buffers 16 32k;
    proxy_buffer_size 64k;
    proxy_busy_buffers_size 128k;
    proxy_read_timeout 90s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;

    # High-efficiency Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Modern Security Headers (HSTS, Anti-Clickjacking, MIME Sniffing Protection)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Cache bypass evaluation logic:
    # 1. Skip caching for mutations (POST, PUT, DELETE, PATCH)
    # 2. Skip caching if authenticated via admin_session cookie
    # 3. Skip caching for admin endpoints
    set $skip_cache 0;

    if ($request_method != GET) {
        set $skip_cache 1;
    }
    if ($http_cookie ~* "admin_session|ea_admin") {
        set $skip_cache 1;
    }
    if ($request_uri ~* "^/admin|^/poorvith|^/api/admin") {
        set $skip_cache 1;
    }
    if ($http_authorization) {
        set $skip_cache 1;
    }

    # Strict rate-limiting for Admin Login endpoints to prevent brute-force attacks
    location ~* ^/(poorvith/login|admin/login|api/admin/login) {
        limit_req zone=esports_auth burst=10 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js immutable static build assets (1 year browser & CDN cache)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Uploaded tournament logos, banners, player photos (30 days cache + hotlink protection)
    location /api/media/ {
        valid_referers none blocked server_names;
        if ($invalid_referer) {
            return 403;
        }

        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass $http_upgrade;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Public static files (favicon, sitemap, robots.txt)
    location ~* \.(ico|txt|xml)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 1d;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    # Main application proxy with Micro-Caching & Concurrency Lock
    location / {
        limit_req zone=esports_req burst=300 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Micro-cache configuration
        proxy_cache ESPORTS_CACHE;
        proxy_cache_bypass $skip_cache;
        proxy_no_cache $skip_cache;
        proxy_cache_valid 200 301 302 30s;
        proxy_cache_valid 404 1m;

        # Stale cache handling (Zero downtime during revalidation or backend reload)
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        # Debug cache hit status header (HIT, MISS, BYPASS, EXPIRED)
        add_header X-Cache-Status $upstream_cache_status;
    }
}
