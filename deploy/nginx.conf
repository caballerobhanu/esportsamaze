# Nginx configuration for EsportsAmaze (esportsamaze.com)
# Place at: /etc/nginx/sites-available/esportsamaze.com

# 1. Rate limiting zone: max 40 requests/sec per IP to protect against scrapers/DDoS
limit_req_zone $binary_remote_addr zone=esports_req:10m rate=40r/s;

server {
    listen 80;
    listen [::]:80;
    server_name esportsamaze.com www.esportsamaze.com;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Permanent redirect HTTP -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name esportsamaze.com www.esportsamaze.com;

    # SSL Certificate Paths (Auto-managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/esportsamaze.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esportsamaze.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Max upload size (Allows media uploads up to 25MB)
    client_max_body_size 25M;

    # Buffer & Timeout tuning
    proxy_buffers 16 32k;
    proxy_buffer_size 64k;
    proxy_busy_buffers_size 128k;
    proxy_read_timeout 90;
    proxy_connect_timeout 90;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/rss+xml
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Cache Next.js static files (1 year immutable)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache uploaded media images (30 days)
    location /api/media/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_bypass $http_upgrade;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Reverse proxy to Next.js PM2 cluster
    location / {
        limit_req zone=esports_req burst=60 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
